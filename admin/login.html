<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Computer Shop</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


    <!-- =================================================
         ADMIN LOGIN
         ================================================= -->

    <main class="admin-login-page">

        <div class="admin-login-card">


            <!-- LOGO -->

            <div class="admin-logo">

                Computer<span>Shop</span>

            </div>


            <!-- HEADER -->

            <div class="admin-login-header">

                <p>
                    ADMINISTRATION
                </p>

                <h1>
                    Admin Login
                </h1>

                <span>
                    Sign in to manage your Computer Shop.
                </span>

            </div>


            <!-- FORM -->

            <form id="admin-login-form">


                <div class="admin-form-group">

                    <label for="admin-email">
                        Admin Email
                    </label>

                    <input type="email" id="admin-email" placeholder="Enter admin email" required>

                </div>


                <div class="admin-form-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <input type="password" id="admin-password" placeholder="Enter admin password" required>

                </div>


                <button type="submit" class="admin-login-button">
                    Login to Dashboard
                </button>
                <a href="forgot-password.html" class="forgot-password-link">
                    Forgot Password?
                </a>


            </form>


            <!-- BACK -->

            <a href="../index.html" class="admin-back-link">
                ← Back to Computer Shop
            </a>


        </div>

    </main>


    <script src="../js/admin-login.js"></script>

</body>

</html>

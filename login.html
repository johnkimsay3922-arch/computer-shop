<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Computer Shop</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="header">

        <div class="logo">
            Computer<span>Shop</span>
        </div>


        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
                <span id="cartCount">0</span>
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>



    <!-- =================================================
         LOGIN PAGE
         ================================================= -->

    <main class="auth-page">

        <div class="auth-card">


            <!-- LOGIN HEADER -->

            <div class="auth-header">

                <p>
                    COMPUTER SHOP
                </p>

                <h1>
                    Welcome Back
                </h1>

                <span>
                    Login to your account to continue shopping.
                </span>

            </div>



            <!-- LOGIN FORM -->

            <form id="login-form">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>


            </form>



            <!-- REGISTER LINK -->

            <div class="auth-footer">

                <p>
                    Don't have an account?
                </p>

                <a href="register.html">
                    Create Account
                </a>

            </div>


        </div>

    </main>



    <!-- =================================================
         FOOTER
         ================================================= -->

    <footer class="footer">

        <div class="logo">
            Computer<span>Shop</span>
        </div>

        <p>
            Quality computers and accessories for your needs.
        </p>

        <p>
            © 2026 Computer Shop. All rights reserved.
        </p>

    </footer>


<script src="js/auth.js"></script>
    <script src="js/login.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Computer Shop</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <main class="admin-login-page">

        <div class="admin-login-card">

            <div class="admin-logo">

                Computer<span>Shop</span>

            </div>


            <div class="admin-login-header">

                <p>
                    ADMINISTRATION
                </p>

                <h1>
                    Forgot Password?
                </h1>

                <span>
                    Enter your admin email to reset your password.
                </span>

            </div>


            <form id="forgot-password-form">

                <div class="admin-form-group">

                    <label for="admin-email">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Enter your admin email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-login-button"
                >
                    Continue
                </button>

            </form>


            <a
                href="login.html"
                class="admin-back-link"
            >
                ← Back to Admin Login
            </a>

        </div>

    </main>


</body>

</html>

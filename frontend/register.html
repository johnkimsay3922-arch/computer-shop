<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Computer Shop</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =========================================
         HEADER
         ========================================= -->

    <header class="header">

        <div class="logo">
            Computer<span>Shop</span>
        </div>


        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
                <span id="cartCount">0</span>
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>



    <!-- =========================================
         REGISTER PAGE
         ========================================= -->

    <main class="auth-page">


        <div class="auth-card">


            <div class="auth-header">

                <p>
                    COMPUTER SHOP
                </p>

                <h1>
                    Create Account
                </h1>

                <span>
                    Create your account and start shopping.
                </span>

            </div>



            <!-- REGISTER FORM -->

            <form id="register-form">


                <!-- NAME -->

                <div class="form-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="register-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                        required
                        minlength="6"
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="register-confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="register-confirm-password"
                        placeholder="Confirm your password"
                        required
                        minlength="6"
                    >

                </div>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>


            </form>



            <!-- LOGIN LINK -->

            <div class="auth-footer">

                <p>
                    Already have an account?
                </p>

                <a href="login.html">
                    Login here
                </a>

            </div>


        </div>


    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="logo">
            Computer<span>Shop</span>
        </div>


        <p>
            Quality computers and accessories for your needs.
        </p>


        <p>
            © 2026 Computer Shop. All rights reserved.
        </p>

    </footer>

<script src="js/auth.js"></script>
    <script src="js/register.js"></script>

</body>

</html>
